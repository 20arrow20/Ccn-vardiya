name: Emülatör okuma testi

# Commit mesajında [emu] varsa çalışır: uygulama Android emülatöründe açılır, liste okuma hızı ve doğruluğu ölçülür.
on:
  push:
    branches: [main, vardiya-panosu]

jobs:
  emulator:
    if: contains(github.event.head_commit.message, '[emu]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
      - name: Deneme APK derle
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: KVM aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          script: bash tools/emu-test.sh
